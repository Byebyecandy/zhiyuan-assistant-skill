<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>志愿助手</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --surface: #ffffff;
      --ink: #18201a;
      --muted: #6a7169;
      --line: #dde2d8;
      --soft: #edf1e8;
      --teal: #1b7f79;
      --red: #c4493d;
      --amber: #c28a22;
      --blue: #5964a8;
      --green: #4a7c3a;
      --shadow: 0 18px 60px rgba(24, 32, 26, 0.08);
      --radius: 8px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(246, 247, 242, 0.96), rgba(238, 242, 234, 0.96)),
        radial-gradient(circle at 8% 0%, rgba(27, 127, 121, 0.12), transparent 28%),
        radial-gradient(circle at 95% 18%, rgba(194, 138, 34, 0.12), transparent 26%);
      color: var(--ink);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(16px);
      overflow-y: auto;
    }

    main {
      min-width: 0;
      padding: 24px clamp(16px, 3vw, 42px) 38px;
    }

    .brand {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button,
    .copy-btn,
    .source-link,
    .mode-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .nav button {
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 10px;
      text-align: left;
    }

    .nav button:hover,
    .copy-btn:hover,
    .source-link:hover,
    .mode-btn:hover {
      border-color: var(--accent, var(--teal));
      background: #fbfcf8;
    }

    .nav button[aria-selected="true"] {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, white);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
      font-size: 15px;
    }

    .nav-name {
      display: block;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }

    .nav-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .side-section {
      display: none;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .side-section h2 {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .check-list {
      display: grid;
      gap: 9px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
      cursor: pointer;
    }

    .check-row input {
      margin: 2px 0 0;
      accent-color: var(--teal);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    .badge.strong {
      background: color-mix(in srgb, var(--accent) 14%, white);
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 32%, white);
    }

    h2.page-title {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 860px;
      font-size: 15px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
    }

    .copy-btn,
    .mode-btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
    }

    .copy-btn svg,
    .mode-btn svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h3 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 16px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .info-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfcf8;
      min-width: 0;
    }

    .info-card h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0;
    }

    ul.clean {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    ul.clean li {
      position: relative;
      padding-left: 14px;
      color: #2e352f;
      font-size: 14px;
      line-height: 1.62;
      overflow-wrap: anywhere;
    }

    ul.clean li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.74em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .style-list {
      display: grid;
      gap: 10px;
    }

    .style-item {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .style-item:last-child {
      border-bottom: 0;
    }

    .style-key {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .style-val {
      font-size: 14px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .prompt-box {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px;
      background: #101610;
      color: #f6f7f2;
      line-height: 1.65;
      font-size: 13px;
      overflow-wrap: anywhere;
      outline: none;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 9px;
    }

    .source-link {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .source-link svg {
      width: 15px;
      height: 15px;
      color: var(--accent);
      flex: 0 0 auto;
    }

    .blend {
      margin-top: 16px;
      display: grid;
      gap: 16px;
    }

    .blend-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(340px, 1.05fr);
      gap: 16px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mode-btn[aria-pressed="true"] {
      color: #fff;
      border-color: var(--teal);
      background: var(--teal);
    }

    .matrix {
      display: grid;
      gap: 8px;
    }

    .matrix-row {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .matrix-row:last-child {
      border-bottom: 0;
    }

    .matrix-row strong {
      color: var(--accent);
      font-size: 13px;
    }

    .matrix-row span {
      font-size: 13px;
      color: #2e352f;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      min-width: 180px;
      max-width: min(360px, calc(100vw - 40px));
      padding: 12px 14px;
      background: #18201a;
      color: white;
      border-radius: var(--radius);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 13px;
      line-height: 1.4;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-tabs {
      display: none;
      margin-bottom: 14px;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 4px;
    }

    .mobile-tabs button {
      flex: 0 0 auto;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }

    .mobile-tabs button[aria-selected="true"] {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    @media (max-width: 1060px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .nav {
        display: none;
      }

      .mobile-tabs {
        display: flex;
      }

      .dashboard,
      .blend-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      main {
        padding: 18px 12px 28px;
      }

      aside {
        padding: 16px 12px;
      }

      .topbar {
        display: grid;
      }

      .actions {
        justify-content: flex-start;
      }

      .grid-two {
        grid-template-columns: 1fr;
      }

      .style-item,
      .matrix-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .source-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <section class="brand" aria-label="标题">
        <h1>志愿助手</h1>
        <p>6 个可选版本：5 个单模块版 + 1 个终极整合版。抽象公开方法论与表达结构，不冒充真人，不生成个人声纹。</p>
      </section>

      <nav class="nav" id="sideNav" aria-label="模块选择"></nav>

      <section class="side-section" aria-label="组合选择">
        <h2>组合 Skill</h2>
        <div class="check-list" id="blendChecks"></div>
      </section>
    </aside>

    <main>
      <div class="mobile-tabs" id="mobileTabs" aria-label="模块移动端选择"></div>

      <section class="topbar">
        <div class="title-block">
          <div class="eyebrow" id="badges"></div>
          <h2 class="page-title" id="expertTitle"></h2>
          <p class="subtitle" id="expertIntro"></p>
        </div>
        <div class="actions">
          <button class="copy-btn" id="copyCurrent" type="button">
            <i data-lucide="copy"></i>
            复制当前模块
          </button>
          <button class="copy-btn" id="copyBlend" type="button">
            <i data-lucide="layers"></i>
            复制终极版
          </button>
        </div>
      </section>

      <section class="dashboard" aria-label="方法模块资料面板">
        <div class="panel">
          <div class="panel-head">
            <h3>方法蒸馏</h3>
            <span class="badge" id="confidenceBadge"></span>
          </div>
          <div class="panel-body">
            <div class="grid-two">
              <article class="info-card">
                <h4>公开定位线索</h4>
                <ul class="clean" id="profileList"></ul>
              </article>
              <article class="info-card">
                <h4>著作 / 视频 / 公开内容线索</h4>
                <ul class="clean" id="workList"></ul>
              </article>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>表达方法</h3>
            <span class="badge strong" id="styleBadge"></span>
          </div>
          <div class="panel-body">
            <div class="style-list" id="styleList"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>模块 Skill 提示词</h3>
            <span class="badge">可直接复制</span>
          </div>
          <div class="panel-body">
            <textarea class="prompt-box" id="promptBox" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>证据与限制</h3>
            <span class="badge" id="limitBadge"></span>
          </div>
          <div class="panel-body">
            <div class="info-card" style="margin-bottom: 12px;">
              <h4>注意</h4>
              <ul class="clean" id="cautionList"></ul>
            </div>
            <div class="source-grid" id="sourceList"></div>
          </div>
        </div>
      </section>

      <section class="blend" aria-label="终极版Skill面板">
        <div class="panel">
          <div class="panel-head">
            <h3>终极版 Skill</h3>
            <div class="mode-tabs" id="modeTabs">
              <button class="mode-btn" type="button" data-mode="consult" aria-pressed="true">
                <i data-lucide="message-square-text"></i>
                咨询
              </button>
              <button class="mode-btn" type="button" data-mode="script" aria-pressed="false">
                <i data-lucide="scroll-text"></i>
                脚本
              </button>
              <button class="mode-btn" type="button" data-mode="audit" aria-pressed="false">
                <i data-lucide="list-checks"></i>
                评审
              </button>
            </div>
          </div>
          <div class="panel-body blend-grid">
            <div>
              <div class="matrix" id="blendMatrix"></div>
            </div>
            <textarea class="prompt-box" id="blendBox" spellcheck="false"></textarea>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已复制</div>

  <script>
    const experts = [
      {
        id: "zhang",
        color: "#c4493d",
        alias: "东邪",
        name: "张雪峰",
        versionName: "现实版",
        role: "考研与高考升学规划大众传播者",
        confidence: "公开资料较多",
        evidenceLevel: "高",
        intro: "以强冲突表达、东北口语化段子和就业结果导向见长，擅长把院校、专业、考研、就业之间的关系讲成普通家庭能立刻理解的选择题。",
        profile: [
          "公开资料多称其本名张子彪，毕业于郑州大学给排水工程专业，曾长期从事考研辅导与升学规划。",
          "搜狐行业文章称其为苏州峰学蔚来教育科技有限公司创始人、苏州研途教育科技公司联合创始人。",
          "截至 2026-06-10 检索，21财经等媒体报道其于 2026-03-24 去世；本模块只抽象其公开教学风格，不做真人代言。"
        ],
        works: [
          "《选择比努力更重要：名师张雪峰手把手教你填报高考志愿》，微信读书与京东读书均有书目信息。",
          "《决胜高中三年关键期》《方向比努力更重要：名师张雪峰考研通关攻略》《你离考研成功，就差这本书》等图书可在得到、图书馆书目、豆瓣等平台检索到。",
          "抖音账号资料显示其账号为 zxfls，定位为教育领域创作者、考研导师；早期因解读 985 高校的视频出圈。",
          "直播与短视频中多次围绕专业选择、新闻学、考研路径、普通家庭就业风险等议题形成公共讨论。"
        ],
        style: {
          "语气": "高能、快节奏、冲突感强，常用反问和极端化比喻先抓住注意力，再补充现实理由。",
          "结构": "先给结论，再解释为什么；常从就业、薪资、城市、学历门槛倒推专业和院校选择。",
          "语言": "口语、东北味、段子化，把复杂概念压缩成家长能听懂的日常类比。",
          "风险": "表达锋利，容易被理解为绝对化；用于 Skill 时要保留现实感，去掉人身攻击和过度断言。"
        },
        dna: "现实结果导向、降低信息差、就业倒推、强提醒",
        prompt: `你是一个升学规划解释助手，借鉴张雪峰式的公开教学方法，但不冒充张雪峰本人。

任务：
1. 先用一句话给出直接判断，让家长知道当前选择的核心利弊。
2. 用就业、城市、学历门槛、专业壁垒、家庭试错成本五个维度倒推升学建议。
3. 把复杂政策讲成普通家庭能理解的例子，但不要使用侮辱性、过度绝对化或恐吓式语言。
4. 每个建议都必须给出前提条件：省份、选科、分数/位次、家庭资源、学生兴趣与抗压能力。
5. 输出“能选 / 慎选 / 不建议”的分层结论，并列出需要二次核验的数据。

语气：
直接、口语、节奏快、有现实感；可以使用生活化比喻，但不能冒充真人身份。`,
        caution: [
          "不要复刻真人口头禅到让用户误以为本人发言。",
          "不要把专业前景说成绝对命运，必须保留地区、院校层次和个人能力变量。",
          "公开报道涉及其去世信息，使用该风格时应保持尊重。"
        ],
        sources: [
          ["知乎专栏：高考志愿填报老师排名", "https://zhuanlan.zhihu.com/p/693962949"],
          ["微信读书：《选择比努力更重要》", "https://weread.qq.com/web/bookDetail/4ce326a0725223684ceab36"],
          ["得到：《决胜高中三年关键期》", "https://www.dedao.cn/ebook/detail?id=pAVMknaY9VDA6M7OjdpEvLnKm85rPw9lrO3ZxykgeQJaRb4oBqNzGlX12boL1Nl9"],
          ["抖音资料：张雪峰老师 zxfls", "https://v.douyin.com/GkmQXM/"],
          ["21财经：张雪峰逝世报道", "https://www.21jingji.com/article/20260324/herald/da2be4ec2bccc5002a179add588ec535.html"]
        ]
      },
      {
        id: "liang",
        color: "#1b7f79",
        alias: "西毒",
        name: "梁斌",
        versionName: "全链路版",
        role: "全链条学业规划倡导者",

1. 先收集基础信息：省份、年份、选科、分数/位次、批次、家庭预算、城市偏好、学生兴趣、职业目标、是否接受读研/留学/考公。
2. 用现实结果导向判断专业和学校的长期价值，但避免绝对化、恐吓式表达。
3. 用全链条视角把高中、本科、读研、就业连接起来，给出短期和长期两组动作。

5. 用院校专业画像判断适配度：学校层次、学科实力、城市资源、就业出口、学习成本。

一、家庭画像与关键信息缺口

四、风险清单：政策风险、退档/滑档风险、就业风险、家庭成本风险

    }

    function renderNav() {
      const nav = $("sideNav");
      const mobile = $("mobileTabs");
      nav.innerHTML = "";
      mobile.innerHTML = "";

      versionItems().forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.style.setProperty("--accent", item.color);
        btn.setAttribute("aria-selected", String(item.id === currentId));
        btn.innerHTML = `
          <span class="avatar">${item.alias.slice(0, 1)}</span>
          <span>
            <span class="nav-name">${item.versionName || item.name}</span>
            <span class="nav-meta">${item.alias} · ${item.role}</span>
          </span>
        `;
        btn.addEventListener("click", () => setCurrent(item.id));
        nav.appendChild(btn);

        const mBtn = document.createElement("button");
        mBtn.type = "button";
        mBtn.style.setProperty("--accent", item.color);
        mBtn.setAttribute("aria-selected", String(item.id === currentId));
        mBtn.textContent = `${item.alias} ${item.versionName || item.name}`;
        mBtn.addEventListener("click", () => setCurrent(item.id));
        mobile.appendChild(mBtn);
      });
    }

    function renderChecks() {
      const wrap = $("blendChecks");
      wrap.innerHTML = "";
      versionItems().forEach((item) => {
        const label = document.createElement("label");
        label.className = "check-row";
        label.innerHTML = `
          <input type="checkbox" value="${item.id}" ${selected.has(item.id) ? "checked" : ""} />
          <span><strong>${item.versionName || item.name}</strong><br>${item.dna}</span>
        `;
        label.querySelector("input").addEventListener("change", (event) => {
          if (event.target.checked) selected.add(item.id);
          else selected.delete(item.id);
          if (!selected.size) {
            selected.add(item.id);
            event.target.checked = true;
          }
          renderBlend();
        });
        wrap.appendChild(label);
      });
    }

    function setCurrent(id) {
      currentId = id;
      renderNav();
      renderExpert();
    }

    function listItems(id, items) {
      const ul = $(id);
      ul.innerHTML = items.map((item) => `<li>${item}</li>`).join("");
    }

    function renderExpert() {
      const item = expertById(currentId);
      document.documentElement.style.setProperty("--accent", item.color);

      $("badges").innerHTML = `
        <span class="badge strong">${item.alias}</span>
        <span class="badge">${item.role}</span>
        <span class="badge">证据等级：${item.evidenceLevel}</span>
      `;
      $("expertTitle").textContent = item.id === "ultimate" ? "终极版" : `${item.versionName || item.name}`;
      $("expertIntro").textContent = item.intro;
      $("confidenceBadge").textContent = item.confidence;
      $("styleBadge").textContent = item.dna;
      $("limitBadge").textContent = `证据等级：${item.evidenceLevel}`;

      listItems("profileList", item.profile);
      listItems("workList", item.works);
      listItems("cautionList", item.caution);

      $("styleList").innerHTML = Object.entries(item.style).map(([key, value]) => `
        <div class="style-item">
          <div class="style-key">${key}</div>
          <div class="style-val">${value}</div>
        </div>
      `).join("");

      $("promptBox").value = item.prompt;
      $("sourceList").innerHTML = item.sources.map(([label, url]) => `
        <a class="source-link" href="${url}" target="_blank" rel="noreferrer">
          <span>${label}</span>
          <i data-lucide="external-link"></i>
        </a>
      `).join("");

      refreshIcons();
    }

    function renderBlend() {
      const chosen = experts.filter((item) => selected.has(item.id));
      const matrix = $("blendMatrix");
      matrix.innerHTML = chosen.map((item) => `
        <div class="matrix-row" style="--accent:${item.color}">
          <strong>${item.name}</strong>
          <span>${item.dna}</span>
        </div>
      `).join("");

      const modules = chosen.map((item) => `- ${item.name}模块：${item.dna}`).join("\n");
      const guardrails = chosen.map((item) => `- ${item.name}限制：${item.caution[0]}`).join("\n");
      $("blendBox").value = `你是一个升学规划综合 Skill，不冒充任何真人，只综合公开资料中可抽象的方法。

已选择模块：
${modules}

当前输出模式：
${modePrompts[currentMode]}

    }

    function renderModes() {
      $("modeTabs").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentMode = btn.dataset.mode;
          $("modeTabs").querySelectorAll("button").forEach((node) => {
            node.setAttribute("aria-pressed", String(node === btn));
          });
          renderBlend();
        });
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("已复制到剪贴板");
      } catch (error) {
        showToast("复制受限，请手动选中文本");
      }
    }

    function showToast(text) {
      const toast = $("toast");
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function refreshIcons() {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    $("copyCurrent").addEventListener("click", () => copyText($("promptBox").value));
    $("copyBlend").addEventListener("click", () => copyText($("blendBox").value));

    renderNav();
    renderChecks();
    renderModes();
    renderExpert();
    renderBlend();
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" onload="lucide.createIcons()"></script>
</body>
